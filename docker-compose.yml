# One box (EC2 or any VM): database, Redis, the API and a separate worker.
#   cp backend/.env.example .env   then fill in the secrets marked REQUIRED
#   docker compose up -d --build
# To grow: run more `api` copies behind a load balancer and more `worker` copies; move Postgres to RDS and files to S3.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: eduverse, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}", POSTGRES_DB: eduverse }
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eduverse"], interval: 5s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      ROLE: api
      EMBEDDED_WORKER: "0"
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://eduverse:${DB_PASSWORD}@db:5432/eduverse
      REDIS_URL: redis://redis:6379/0
    ports: [ "8000:8000" ]
    volumes: [ "storage:/data/storage" ]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      ROLE: worker
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://eduverse:${DB_PASSWORD}@db:5432/eduverse
      REDIS_URL: redis://redis:6379/0
    volumes: [ "storage:/data/storage" ]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes: { pg: {}, storage: {} }
